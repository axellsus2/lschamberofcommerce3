<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİR - Yetkili Girişi</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle, #00a8a8 0%, #008080 100%);
            display: flex; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }

        .login-container {
            width: 350px;
            padding: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-main { font-size: 4.5rem; font-weight: 900; letter-spacing: -4px; line-height: 1; margin-bottom: 5px; }
        .logo-sub { font-size: 0.8rem; letter-spacing: 5px; opacity: 0.8; text-transform: uppercase; margin-bottom: 35px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-left: 15px; margin-bottom: 8px; font-size: 0.75rem; font-weight: bold; opacity: 0.9; }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #111;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #40E0D0;
            box-shadow: 0 0 15px rgba(64, 224, 208, 0.4);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border-radius: 20px;
            border: none;
            background: #111;
            color: #40E0D0;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: #000;
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .footer { margin-top: 30px; font-size: 0.65rem; opacity: 0.6; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-main">BİR</div>
        <div class="logo-sub">Ecosystem</div>

        <div class="input-group">
            <label>YÖNETİCİ ADI</label>
            <input type="text" id="username" placeholder="Kullanıcı adınızı girin">
        </div>

        <div class="input-group">
            <label>ŞİFRE</label>
            <input type="password" id="password" placeholder="••••">
        </div>

        <button class="login-btn" onclick="handleLogin()">GİRİŞ YAP</button>

        <div class="footer">
            BİR TECHNOLOGY © 2026<br>
            SADECE YETKİLİ ERİŞİM
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Kesin kural: Admin / 1234
            if (user === "Admin" && pass === "1234") {
                window.location.href = "dashboard.html";
            } else {
                alert("Hatalı giriş! Kullanıcı adı veya şifre yanlış.");
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { handleLogin(); }
        });
    </script>
</body>
</html>
