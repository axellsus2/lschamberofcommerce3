<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİR-Bank Mobil</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; color: #333; padding: 0; }
        .bank-header { background: #008080; color: white; padding: 30px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .balance-card { 
            background: white; width: 85%; margin: -40px auto 20px; padding: 20px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
        }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .action-card { 
            background: white; padding: 15px; border-radius: 15px; text-align: center;
            border: 1px solid #eee; cursor: pointer; transition: 0.3s;
        }
        .action-card:hover { transform: translateY(-5px); border-color: #008080; }
        .action-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }
        .investment-section { padding: 0 20px; }
        .inv-item { 
            background: white; display: flex; justify-content: space-between; 
            padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #008080;
        }
        .back-btn { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="bank-header">
        <a href="dashboard.html" class="back-btn">←</a>
        <h2 style="margin: 10px 0 0 0;">BİR-Bank</h2>
        <small style="opacity:0.8;">Hoş geldin, Efehan</small>
    </div>

    <div class="balance-card">
        <small style="color:#888;">Toplam Varlığın</small>
        <h1 id="bank-bal" style="margin: 10px 0; color:#008080;">₺530.00</h1>
        <small style="color: green;">+2.40% (Bugün)</small>
    </div>

    <div class="action-grid">
        <div class="action-card" onclick="location.href='transfer.html'">
            <span class="action-icon">💸</span>
            <b>Para Transferi</b>
        </div>
        <div class="action-card" onclick="alert('Kredi kartı limitiniz: 50.000 TL')">
            <span class="action-icon">💳</span>
            <b>Kartlarım</b>
        </div>
        <div class="action-card" onclick="alert('QR ile para çekme aktif değil.')">
            <span class="action-icon">🏧</span>
            <b>QR İşlemleri</b>
        </div>
        <div class="action-card" onclick="alert('Ödemeler: Fatura, Vergi, Eğitim')">
            <span class="action-icon">📄</span>
            <b>Ödemeler</b>
        </div>
    </div>

    <div class="investment-section">
        <h3>Piyasalar</h3>
        <div class="inv-item">
            <span><b>Dolar/TL</b></span>
            <span style="color:red;">32.45 ▼</span>
        </div>
        <div class="inv-item">
            <span><b>Altın (Gr)</b></span>
            <span style="color:green;">2.450 ▲</span>
        </div>
        <div class="inv-item">
            <span><b>BİR Fonu</b></span>
            <span style="color:green;">12.80 ▲</span>
        </div>
    </div>

    <script>
        document.getElementById('bank-bal').innerText = "₺" + (parseFloat(localStorage.getItem('userBalance')) || 530).toFixed(2);
    </script>
</body>
</html>
