<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİR - Ana Kumanda</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle, #00a8a8 0%, #008080 100%);
            color: white; display: flex; justify-content: center; align-items: center;
        }

        .phone-frame {
            width: 380px; height: 750px; background: #111; border-radius: 40px;
            border: 12px solid #222; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            overflow: hidden; position: relative;
        }

        .main-content { 
            padding: 15px; 
            height: calc(100% - 115px); 
            overflow-y: auto; 
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .wallet-panel {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border-radius: 20px; padding: 18px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; margin-bottom: 20px; cursor: pointer;
        }

        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }

        .service-card {
            position: relative; background: rgba(255,255,255,0.08);
            padding: 12px 2px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; text-align: center; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .service-card:active { transform: scale(0.92); }

        .badge {
            position: absolute; top: -2px; right: -2px; background: #ff3b30; color: white;
            font-size: 0.65rem; width: 18px; height: 18px; border-radius: 50%;
            display: none; justify-content: center; align-items: center; font-weight: bold; border: 1.5px solid #111;
        }

        .service-icon { font-size: 1.6rem; margin-bottom: 4px; }
        .service-title { font-size: 0.65rem; font-weight: 500; display: block; opacity: 0.9; }

        /* BİR-EVİM LOGO STİLİ */
        .evim-logo {
            width: 36px; height: 36px; margin-bottom: 4px;
            background: rgba(64, 224, 208, 0.1); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(64, 224, 208, 0.3);
        }
        .evim-logo svg { width: 24px; height: 24px; fill: #40E0D0; }

        .nav-bar {
            position: absolute; bottom: 0; width: 100%; height: 95px;
            background: rgba(18, 18, 18, 0.96); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item {
            text-align: center; color: white; opacity: 0.6; cursor: pointer;
            flex: 1; transition: 0.3s;
        }
        .nav-item:hover { opacity: 1; }
        .nav-item div { font-size: 1.4rem; margin-bottom: 3px; }
        .nav-item span { font-size: 0.6rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        .biz-btn-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .biz-btn {
            position: relative; top: -15px; width: 65px; height: 65px;
            background: #40E0D0; border-radius: 50%; color: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 5px solid #111; font-weight: 900; box-shadow: 0 0 20px rgba(64, 224, 208, 0.2);
        }
        .biz-btn span { font-size: 0.55rem; line-height: 1; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="main-content">
            <div class="wallet-panel" onclick="location.href='bank.html'">
                <small style="font-size: 0.6rem; opacity: 0.7; letter-spacing: 1px;">BİR-BANK HESABIM</small>
                <h1 id="balance-display" style="margin:5px 0; font-size: 1.5rem; letter-spacing: -1px;">₺530.00</h1>
                <small style="color:#40E0D0; font-size: 0.7rem; font-weight: bold;">Efehan Doğru</small>
            </div>

            <div class="services-grid">
                <div class="service-card" onclick="location.href='bank.html'"><div class="service-icon">🏛️</div><span class="service-title">Banka</span></div>
                
                <div class="service-card" onclick="location.href='home.html'" style="border: 1px solid rgba(64, 224, 208, 0.4); background: rgba(64, 224, 208, 0.05);">
                    <div class="evim-logo">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.5l7 6.3V18h-2v-6H7v6H5v-6.2l7-6.3zM12 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                        </svg>
                    </div>
                    <span class="service-title" style="color:#40E0D0; font-weight: bold;">BİR-Evim</span>
                </div>

                <div class="service-card" onclick="location.href='transport-card.html'"><div class="service-icon">🚌</div><span class="service-title">BİR-TIK</span></div>
                <div class="service-card" onclick="location.href='music.html'"><div class="service-icon">🎵</div><span class="service-title">Müzik</span></div>
                <div class="service-card" onclick="location.href='food.html'"><div class="service-icon">🍕</div><span class="service-title">Yemek</span></div>
                <div class="service-card" onclick="location.href='passotickets.html'"><div class="service-icon">🏟️</div><span class="service-title">Passo</span></div>
                <div class="service-card" onclick="location.href='tickets.html'"><div class="service-icon">✈️</div><span class="service-title">Uçak</span></div>
                <div class="service-card" onclick="location.href='shop.html'"><div class="service-icon">🛒</div><span class="service-title">Mağaza</span></div>
                <div class="service-card" onclick="location.href='messages.html'" id="msg-card">
                    <div class="badge" id="msg-badge">0</div>
                    <div class="service-icon">💬</div><span class="service-title">Mesajlar</span>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item" onclick="location.href='dashboard.html'">
                <div>🏠</div><span>ANASAYFA</span>
            </div>
            
            <div class="biz-btn-wrapper" onclick="location.href='scan.html'">
                <div class="biz-btn">
                    <div style="font-size: 1.2rem;">BİZ</div>
                    <span>QR ÖDE</span>
                </div>
            </div>

            <div class="nav-item" onclick="location.href='apps.html'">
                <div>📱</div><span>APPS</span>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let balance = parseFloat(localStorage.getItem('userBalance')) || 530.00;
            document.getElementById('balance-display').innerText = "₺" + balance.toFixed(2);

            let msgs = JSON.parse(localStorage.getItem('myMessages')) || [];
            let badge = document.getElementById('msg-badge');
            let unread = localStorage.getItem('unreadCount');

            if(msgs.length > 0 && unread !== '0') {
                badge.style.display = 'flex';
                badge.innerText = msgs.length;
            }

            document.getElementById('msg-card').addEventListener('click', function() {
                localStorage.setItem('unreadCount', '0');
            });
        };
    </script>
</body>
</html>
